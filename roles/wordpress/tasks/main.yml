---
# tasks file for wordpress

- name: Create the WordPress database inside MariaDB
  ansible.mariadb.mariadb_db:
    name: "{{ wp_db_name }}"
    state: present
    login_unix_socket: /var/lib/mysql/mysql.sock

- name: Create the dedicated database user and grant target schema access
  ansible.mariadb.mariadb_user:
    name: "{{ wp_db_user }}"
    password: "{{ wp_db_password }}"
    priv: "{{ wp_db_name }}.*:ALL"
    state: present
    host: "{{ wp_db_host }}"
    login_unix_socket: /var/lib/mysql/mysql.sock

- name: Explicitly remove any existing corrupted archive
  ansible.builtin.file:
    path: /tmp/wordpress.tar.gz
    state: absent

- name: Download the latest stable WordPress archive engine
  ansible.builtin.get_url:
    url: https://wordpress.org/latest.tar.gz 
    dest: /tmp/wordpress.tar.gz
    mode: 0644
    force: yes 

- name: Extract the compressed application files into the target web root
  ansible.builtin.unarchive:
    src: /tmp/wordpress.tar.gz
    dest: /var/www/html
    remote_src: yes
    extra_opts: [--strip-components=1]
    owner: apache
    group: apache

- name: Configure TLS self-signed certificates for local HTTPS compliance
  ansible.builtin.command: >
    openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/pki/tls/private/apache-selfsigned.key -out /etc/pki/tls/certs/apache-selfsigned.crt -subj /C=US/ST=MI/L=Sault/O=BMCC/CN={{ wp_server_domain }}
  args:
    creates: /etc/pki/tls/certs/apache-selfsigned.crt
  notify: Restart Web Server

